syntax = "proto3";

package github.com.martketplace.vkr.balance.pkg.api.grpc.v1.admin;

import "v1/domain/balance_domain.proto";

option go_package = "github.com/martketplace-vkr/balance/pkg/api/grpc/v1/admin;admin";

service BalanceAdminService {
  rpc GetWallet(GetWalletRequest) returns (GetWalletResponse);
  rpc GetWalletTransactions(GetWalletTransactionsRequest) returns (GetWalletTransactionsResponse);
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse);
  rpc PostAdjustment(PostAdjustmentRequest) returns (PostAdjustmentResponse);
  rpc ListTopUps(ListTopUpsRequest) returns (ListTopUpsResponse);
  rpc ConfirmTopUp(ConfirmTopUpRequest) returns (ConfirmTopUpResponse);
}

message GetWalletRequest {
  .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.WalletOwnerType owner_type = 1;
  int64 owner_id = 2;
}

message GetWalletResponse {
  .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.Wallet wallet = 1;
}

message GetWalletTransactionsRequest {
  .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.WalletOwnerType owner_type = 1;
  int64 owner_id = 2;
  optional int64 currency_code = 3;
  uint32 limit = 4;
  uint64 offset = 5;
}

message GetWalletTransactionsResponse {
  repeated .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.LedgerTransaction transactions = 1;
}

message GetTransactionRequest {
  int64 transaction_id = 1;
}

message GetTransactionResponse {
  .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.LedgerTransaction transaction = 1;
}

message PostAdjustmentRequest {
  .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.WalletOwnerType owner_type = 1;
  int64 owner_id = 2;
  .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.Money money = 3;
  string idempotency_key = 4;
  string reason = 5;
}

message PostAdjustmentResponse {
  .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.LedgerTransaction transaction = 1;
}

message ListTopUpsRequest {
  optional int64 currency_code = 1;
  optional .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.ProviderType provider_type = 2;
  optional .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.TopUpStatus status = 3;
  uint32 limit = 4;
  uint64 offset = 5;
}

message ListTopUpsResponse {
  repeated .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.TopUp top_ups = 1;
}

message ConfirmTopUpRequest {
  string external_id = 1;
  string provider_name = 2;
  .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.Money money = 3;
  string webhook_event_id = 4;
}

message ConfirmTopUpResponse {
  .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.TopUp top_up = 1;
  .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.LedgerTransaction transaction = 2;
}
