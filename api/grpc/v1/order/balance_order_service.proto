syntax = "proto3";

package github.com.martketplace.vkr.balance.pkg.api.grpc.v1.order;

import "v1/domain/balance_domain.proto";

option go_package = "github.com/martketplace-vkr/balance/pkg/api/grpc/v1/order;order";

service BalanceOrderService {
  rpc ReserveFunds(ReserveFundsRequest) returns (ReserveFundsResponse);
  rpc CaptureFunds(CaptureFundsRequest) returns (CaptureFundsResponse);
  rpc ReleaseFunds(ReleaseFundsRequest) returns (ReleaseFundsResponse);
  rpc RefundFunds(RefundFundsRequest) returns (RefundFundsResponse);
}

message ReserveFundsRequest {
  int64 user_id = 1;
  int64 order_id = 2;
  .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.Money money = 3;
  string idempotency_key = 4;
  string reason = 5;
}

message ReserveFundsResponse {
  .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.LedgerTransaction transaction = 1;
}

message CaptureFundsRequest {
  int64 user_id = 1;
  int64 order_id = 2;
  .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.Money money = 3;
  string idempotency_key = 4;
  string reason = 5;
}

message CaptureFundsResponse {
  .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.LedgerTransaction transaction = 1;
}

message ReleaseFundsRequest {
  int64 user_id = 1;
  int64 order_id = 2;
  .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.Money money = 3;
  string idempotency_key = 4;
  string reason = 5;
}

message ReleaseFundsResponse {
  .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.LedgerTransaction transaction = 1;
}

message RefundFundsRequest {
  int64 user_id = 1;
  int64 order_id = 2;
  .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.Money money = 3;
  string idempotency_key = 4;
  string reason = 5;
}

message RefundFundsResponse {
  .github.com.martketplace.vkr.balance.pkg.api.grpc.v1.domain.LedgerTransaction transaction = 1;
}
